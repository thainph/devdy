name: release
run-name: Release ${{ github.ref_name }}

# Push a vX.Y.Z tag to build a universal macOS app and publish it as a GitHub
# Release. Both architectures compile in parallel (aarch64 and x86_64 used to
# compile back to back inside one `tauri build --target universal-apple-darwin`),
# then one job merges them with lipo and bundles.
#
# Rust cache: a tag run can only read caches saved on its own ref or on the
# default branch, so release jobs never save; ci.yml's `release-cache` job
# keeps the matching cache warm on main. The build jobs therefore restore
# caches written by main-branch runs only (PR caches are not visible to tags);
# that trust in main is accepted to keep release builds fast.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag format and version files
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF is not a vX.Y.Z tag"
            exit 1
          fi
          want="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)
          lock=$(grep -A1 '^name = "devdy"$' src-tauri/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          status=0
          for pair in "package.json=$pkg" "src-tauri/tauri.conf.json=$conf" "src-tauri/Cargo.toml=$cargo" "src-tauri/Cargo.lock=$lock"; do
            if [[ "${pair#*=}" != "$want" ]]; then
              echo "::error::${pair%%=*} has version ${pair#*=}, tag is $want"
              status=1
            fi
          done
          exit "$status"

  build:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build binary
        uses: ./.github/actions/build-macos-binary
        with:
          target: ${{ matrix.target }}
          save-cache: 'false'

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devdy-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/devdy
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      # No dependency cache here: installing is ~15s and this job produces the
      # release assets.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # `tauri bundle` reads Cargo metadata; it does not compile anything.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The Node sidecar is bundled as an app resource, so its
      # dependencies (@anthropic-ai/claude-agent-sdk) must be installed
      # before Tauri bundles the app.
      - name: Install sidecar dependencies
        working-directory: sidecar
        run: npm ci --omit=dev

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: devdy-*
          path: binaries

      - name: Merge universal binary
        run: |
          set -euo pipefail
          out=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/devdy" \
            binaries/devdy-aarch64-apple-darwin/devdy \
            binaries/devdy-x86_64-apple-darwin/devdy
          chmod +x "$out/devdy"
          lipo -info "$out/devdy"

      - name: Bundle app
        run: pnpm tauri bundle --target universal-apple-darwin --bundles app,dmg --ci

      - name: Collect release assets
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p assets
          cp "$bundle"/dmg/*.dmg assets/
          tar -czf assets/Devdy_universal.app.tar.gz -C "$bundle/macos" Devdy.app
          ls -la assets

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 1

  # The only job with write access; it runs no project or third-party code.
  publish:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --verify-tag \
              --title "Devdy $TAG" \
              --notes "Download the .dmg from the assets below to install."
          fi
