[package]
name = "devdy-relay"
version = "0.1.0"
edition = "2021"
description = "Devdy Remote Control Relay — WSS bridge that routes opaque E2E-encrypted envelopes by room_id (Topology B, bind localhost behind reverse proxy)."
license = "MIT"
publish = false

[[bin]]
name = "devdy-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.24"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
